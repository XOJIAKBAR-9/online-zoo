<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us | Online Zoo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../components/header.style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <!-- Header/Navigation -->
    <div id="header-placeholder"></div>

    <!-- HERO IMAGE -->
    <section class="hero">
        <img src="../../assets/images/touchleopard.png" alt="Zoo live cam">
    </section>

    <!-- CONTACT SECTION -->
    <section class="contact-section">

        <div class="contact-left">
            <h2>GET IN TOUCH</h2>
            <p>
                Whether you have a question, or would like to say hello,
                we're happy to hear from you. Please use the form to send
                us a message and we'll get back to you as soon as we can.
            </p>
        </div>

        <div class="contact-right">
            <form>

                <label>Your Name</label>
                <input type="text" placeholder="First and last name">

                <label>Your Email Address</label>
                <input type="email" placeholder="Enter your email">

                <label>Subject</label>
                <input type="text" placeholder="Enter the subject">

                <label>Message</label>
                <textarea placeholder="Enter your message"></textarea>

                <button type="submit">SEND MESSAGE →</button>

            </form>
        </div>

    </section>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="footer-top">
            <div class="footer-logo">online <span>ZOO</span></div>

            <div class="footer-links">
                <a href="#">ABOUT</a>
                <a href="#">MAP</a>
                <a href="#">ZOOS</a>
                <a href="#">CONTACT US</a>
            </div>

            <button class="donate-btn">DONATE FOR VOLUNTEERS →</button>
        </div>

        <div class="footer-bottom">
            <p>© 2021 DinaK</p>
        </div>
    </footer>

</body>
</html>
