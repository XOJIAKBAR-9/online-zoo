<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Donation - Step 3: Payment Information</title>
    <link rel="stylesheet" href="../../style.css" />
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="../../../../dist/pages/donation/step3.js" defer></script>
  </head>
  <body>
    <div class="step-container">
      <!-- Step 3 Form -->
      <div class="step-form step-3">
        <div class="form-card">
          <div class="form-header">
            <h2>Make Your Donation</h2>
          </div>
          
          <form class="donation-form" id="donationStep3Form">
            <div class="form-body">
              <div class="payment-header">Payment Information:</div>
              <hr class="divider" />

              <div class="form-grid">
                <div class="input-group">
                  <label><span class="required-asterisk">*</span>Credit Card Number</label>
                  <input type="text" id="cardNumber" placeholder="1234 5678 9012 3456" />
                </div>
                <div class="input-group cvv-group">
                  <label><span class="required-asterisk">*</span>CVV Number</label>
                  <input type="text" id="cvvNumber" placeholder="123" maxlength="4" />
                </div>
              </div>

              <div class="expiration-row">
                <label><span class="required-asterisk">*</span>Expiration Date</label>
                <div class="expiration-inputs">
                  <select id="expMonth" aria-label="Expiration month">
                    <option value="">Month</option>
                    <option value="01">01 - January</option>
                    <option value="02">02 - February</option>
                    <option value="03">03 - March</option>
                    <option value="04">04 - April</option>
                    <option value="05">05 - May</option>
                    <option value="06">06 - June</option>
                    <option value="07">07 - July</option>
                    <option value="08">08 - August</option>
                    <option value="09">09 - September</option>
                    <option value="10">10 - October</option>
                    <option value="11">11 - November</option>
                    <option value="12">12 - December</option>
                  </select>
                  <select id="expYear" aria-label="Expiration year">
                    <option value="">Year</option>
                    <option value="2026">2026</option>
                    <option value="2027">2027</option>
                    <option value="2028">2028</option>
                    <option value="2029">2029</option>
                    <option value="2030">2030</option>
                    <option value="2031">2031</option>
                    <option value="2032">2032</option>
                    <option value="2033">2033</option>
                    <option value="2034">2034</option>
                    <option value="2035">2035</option>
                  </select>
                </div>
              </div>
            </div>

            <div class="form-footer">
              <div class="pagination">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
              </div>

              <button type="button" class="step3-back-link" id="backBtn">Back</button>

              <div class="next-wrapper">
                <button type="button" class="step3-complete-btn" id="completeBtn">
                  COMPLETE DONATION <span class="arrow-icon">→</span>
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
